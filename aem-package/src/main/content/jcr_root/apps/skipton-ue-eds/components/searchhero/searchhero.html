<section class="search-hero"
         data-aue-resource="${resource.path}"
         data-aue-type="reference"
         data-aue-label="Search Hero">
  <h1 data-aue-prop="title"
      data-aue-type="text"
      data-aue-label="Title">${properties.title}</h1>
  <div data-aue-prop="description"
       data-aue-type="richtext"
       data-aue-label="Introduction">${properties.description @ context='html'}</div>
</section>
